<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3b6ea5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>오늘의 작곡</title>
<style>
:root{--bg:#f4f1ea;--card:#fffdf8;--fg:#25231f;--mute:#8a857a;--line:#e3ded2;--acc:#3b6ea5;--done:#4a9d6b;--warn:#c0762b}
@media (prefers-color-scheme:dark){:root{--bg:#15171c;--card:#1e2128;--fg:#e8e6e1;--mute:#8b909a;--line:#2d313a;--acc:#6ea8e0;--done:#5bbf85;--warn:#e0a060}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:12px}
.date{font-size:22px;font-weight:700}
.phase{font-size:13px;color:var(--acc);margin-top:2px}
.lv{display:inline-block;font-size:12px;color:var(--mute);margin-top:4px}
.task{margin-top:14px;padding:14px;border:1px dashed var(--line);border-radius:10px;font-size:17px;word-break:keep-all}
.task.done{color:var(--mute);text-decoration:line-through}
.rest{margin-top:14px;padding:14px;border-radius:10px;background:color-mix(in srgb,var(--done) 12%,transparent);font-size:15px}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;margin-left:6px;background:var(--done);color:#fff;vertical-align:middle}
.stats{display:flex;gap:20px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.stats div{font-size:12px;color:var(--mute)}.stats b{display:block;font-size:20px;color:var(--fg)}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--done)}
h2{font-size:13px;color:var(--mute);margin:0 0 6px;font-weight:600}
.ck{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line);font-size:15px}
.ck:last-child{border-bottom:none}
.box{flex:none;width:20px;height:20px;margin-top:2px;border:2px solid var(--line);border-radius:6px;display:grid;place-items:center;font-size:13px;color:#fff}
.ck.on .box{background:var(--done);border-color:var(--done)}
.ck.on span{color:var(--mute);text-decoration:line-through}
.ck .tag{font-size:11px;color:var(--acc);white-space:nowrap;margin-top:3px}
.note{font-size:12px;color:var(--mute);margin-top:12px}
.stale{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:13px;background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.up{padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}.up:last-child{border-bottom:none}
.up b{display:block;font-size:12px;color:var(--acc);font-weight:600}
.up.rest{color:var(--mute)}
.goal{font-size:14px}
.goal .gl{font-size:12px;color:var(--acc);margin-bottom:4px}
textarea{width:100%;font:inherit;font-size:15px;line-height:1.55;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px;resize:vertical;min-height:96px}
textarea:focus{outline:2px solid color-mix(in srgb,var(--acc) 50%,transparent);border-color:var(--acc)}
.mstat{font-size:12px;color:var(--mute);margin-top:6px;min-height:1.2em}
.mstat.err{color:#d55}
details.pm{border-bottom:1px dashed var(--line);padding:8px 0}details.pm:last-child{border-bottom:none}
details.pm summary{font-size:14px;cursor:pointer;list-style:none}details.pm summary::-webkit-details-marker{display:none}
details.pm summary b{color:var(--acc);font-size:12px;margin-right:8px}
details.pm textarea{margin-top:8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
button,input{font:inherit}
.btn{padding:9px 14px;border-radius:9px;border:1px solid var(--line);background:none;color:var(--fg);font-size:14px}
.btn.main{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.small{padding:6px 10px;font-size:13px}
input{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:15px;margin-top:8px}
.err{color:#d55;font-size:13px;margin-top:8px;min-height:1.2em}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">

<!-- 처음 연결 / 로그인 -->
<section id="setup" class="card hidden">
  <div class="date" style="font-size:18px">📱 폰 연결</div>
  <div class="note" style="margin-top:6px">PC 앱 설정 → 폰 동기화 → <b>폰 연결 코드 복사</b>로 얻은 코드를 붙여 넣고, Supabase 계정으로 로그인하세요. 처음 한 번만 하면 돼요.</div>
  <input id="code" placeholder="연결 코드 (PC에서 복사한 글자)" autocomplete="off" autocapitalize="off">
  <input id="email" type="email" placeholder="이메일" autocomplete="username">
  <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password">
  <div class="row"><button class="btn main" id="login">연결하고 보기</button></div>
  <div class="err" id="err"></div>
</section>

<!-- 오늘 화면 -->
<section id="main" class="hidden">
  <div class="top">
    <div><div class="date" id="date"></div><div class="phase" id="phase"></div><div class="lv" id="lv"></div></div>
    <button class="btn small" id="refresh" aria-label="새로고침">⟳</button>
  </div>
  <div id="stale" class="stale hidden"></div>

  <div class="card">
    <h2>오늘 과제 <span id="doneBadge" class="badge hidden">완료</span></h2>
    <div id="task" class="task"></div>
    <div id="rest" class="rest hidden">오늘은 휴식일이에요. 쉬어 가요 🌿</div>
    <div class="stats">
      <div>연속<b id="streak">0</b></div>
      <div style="flex:1">오늘 목록<b id="pctDay">0%</b><div class="bar"><i id="barDay"></i></div></div>
      <div style="flex:1">이번 달<b id="pctMonth">0%</b><div class="bar"><i id="barMonth"></i></div></div>
    </div>
  </div>

  <div class="card">
    <h2>오늘 목록</h2>
    <div id="items"></div>
  </div>

  <div class="card" id="weekCard">
    <h2>이번 주 목표</h2>
    <div class="goal"><div class="gl" id="weekLabel"></div><div id="weekItems"></div></div>
  </div>

  <div class="card" id="monthCard">
    <h2>이번 달 목표</h2>
    <div class="goal"><div class="gl" id="monthLabel"></div><div id="monthItems"></div></div>
  </div>

  <div class="card">
    <h2>오늘 메모</h2>
    <textarea id="memoToday" placeholder="오늘 한 것, 느낀 점, 내일 할 것..." rows="4"></textarea>
    <div class="mstat" id="memoStat"></div>
  </div>

  <div class="card" id="pastCard">
    <h2>지난 메모</h2>
    <div id="pastMemos"></div>
  </div>

  <div class="card" id="upCard">
    <h2>미리 보기</h2>
    <div id="upcoming"></div>
  </div>

  <div class="note" id="sync"></div>
  <div class="note">과제 체크와 목록 편집은 PC 앱에서 해 주세요. 메모는 폰에서도 고칠 수 있고 PC와 자동으로 맞춰져요.</div>
  <div class="row"><button class="btn small" id="logout">연결 해제</button></div>
</section>

</div>
<script>
const KEY='composer-mobile-v1';
const $=id=>document.getElementById(id);
let C=(()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}})();
const store=()=>{try{localStorage.setItem(KEY,JSON.stringify(C))}catch(e){}};
const base=()=>String(C.u||'').replace(/\/+$/,'');
const urlOk=u=>/^https:\/\/[^\s\/]+\/?$/i.test(u)||/^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?\/?$/i.test(u);
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const hm=d=>String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');

async function token(grant,body){
  const r=await fetch(base()+'/auth/v1/token?grant_type='+grant,{method:'POST',headers:{apikey:C.k,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok||!j.access_token)throw new Error(j.error_description||j.msg||j.message||('로그인 실패 ('+r.status+')'));
  C.at=j.access_token;C.rt=j.refresh_token;C.exp=Date.now()+(j.expires_in||3600)*1000;store();return C.at;
}
async function access(force){
  if(!force&&C.at&&C.exp>Date.now()+60000)return C.at;
  return token('refresh_token',{refresh_token:C.rt});
}
async function fetchSnap(){
  const get=tok=>fetch(base()+'/rest/v1/snapshots?select=data,updated_at&limit=1',{headers:{apikey:C.k,Authorization:'Bearer '+tok}});
  let r=await get(await access());
  if(r.status===401)r=await get(await access(true));
  if(!r.ok)throw new Error('불러오기 실패 ('+r.status+')');
  const rows=await r.json();
  return rows&&rows[0]?{data:rows[0].data,at:rows[0].updated_at}:null;
}

function show(which){$('setup').classList.toggle('hidden',which!=='setup');$('main').classList.toggle('hidden',which!=='main')}

function draw(snap,offline){
  const snapD=snap.data,now=new Date(),today=ymd(now);
  const live=snapD.date===today;               // PC가 오늘 보낸 데이터인가
  const plan=(snapD.days||[]).find(x=>x.date===today); // PC가 미리 보내 둔 오늘 계획
  const d=live?snapD:(plan?{...plan,phase:snapD.phase,level:'',done:false}:snapD);
  const dt=new Date((d.date||snapD.date)+'T00:00:00');
  $('date').textContent=(dt.getMonth()+1)+'월 '+dt.getDate()+'일 '+(d.dow||snapD.dow)+'요일';
  $('phase').textContent=live?(snapD.phase||''):'';
  $('lv').textContent=live&&snapD.level?('난이도 '+snapD.level):'';
  $('task').textContent=d.task||'(오늘 과제가 아직 없어요)';
  $('task').classList.toggle('done',!!d.done);
  $('task').classList.toggle('hidden',!!d.rest);
  $('rest').classList.toggle('hidden',!d.rest);
  $('doneBadge').classList.toggle('hidden',!d.done);
  // 진행률·연속일은 PC가 오늘 보낸 경우에만 의미가 있어요
  document.querySelector('.stats').classList.toggle('hidden',!live);
  $('streak').textContent=(snapD.streak||0)+'일';
  $('pctDay').textContent=(snapD.pctDay||0)+'%';$('barDay').style.width=(snapD.pctDay||0)+'%';
  $('pctMonth').textContent=(snapD.pctMonth||0)+'%';$('barMonth').style.width=(snapD.pctMonth||0)+'%';
  const box=$('items');box.textContent='';
  (d.items||[]).forEach(i=>{
    const row=document.createElement('div');row.className='ck'+(i.x?' on':'');
    const b=document.createElement('div');b.className='box';b.textContent=i.x?'✓':'';
    const s=document.createElement('span');s.textContent=i.t;s.style.flex='1';
    row.append(b,s);
    if(i.c){const t=document.createElement('span');t.className='tag';t.textContent='핵심';row.append(t)}
    box.append(row);
  });
  if(!(d.items||[]).length){const e=document.createElement('div');e.className='note';e.textContent='목록이 비어 있어요.';box.append(e)}
  // 안내: PC 데이터가 오늘 것이 아닐 때
  const st=$('stale');
  if(!live&&plan){st.textContent='PC가 아직 오늘 체크 상태를 보내지 않아서, 미리 받아 둔 오늘 계획을 보여 드려요. 체크 상태는 PC 앱을 켜면 반영돼요.';st.classList.remove('hidden')}
  else if(!live){st.textContent='PC에서 받은 데이터가 오래됐어요('+(dt.getMonth()+1)+'/'+dt.getDate()+' 기준). PC 앱을 켜 주세요.';st.classList.remove('hidden')}
  else st.classList.add('hidden');
  // 미리 보기: 오늘 다음 날부터
  const up=$('upcoming');up.textContent='';
  const next=(snapD.days||[]).filter(x=>x.date>today).slice(0,7);
  next.forEach(x=>{
    const r=document.createElement('div');r.className='up'+(x.rest?' rest':'');
    const h=document.createElement('b');const xd=new Date(x.date+'T00:00:00');h.textContent=(xd.getMonth()+1)+'/'+xd.getDate()+' '+x.dow;
    const t=document.createElement('span');t.textContent=x.rest?'휴식일':(x.task||'(과제 없음)');
    r.append(h,t);up.append(r);
  });
  $('upCard').classList.toggle('hidden',!next.length);
  drawGoals(snapD,today);
  const at=snap.at?new Date(snap.at):null;
  $('sync').textContent=(offline?'오프라인이라 저장된 내용을 보여 줘요. ':'')+(at&&!isNaN(at)?'PC에서 마지막으로 받은 시각 '+(at.getMonth()+1)+'/'+at.getDate()+' '+hm(at):'');
}

function mondayOf(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-(x.getDay()+6)%7);return ymd(x)}
function goalList(box,items){
  box.textContent='';
  (items||[]).forEach(i=>{
    const row=document.createElement('div');row.className='ck'+(i.x?' on':'');
    const b=document.createElement('div');b.className='box';b.textContent=i.x?'✓':'';
    const t=document.createElement('span');t.textContent=i.t;t.style.flex='1';
    row.append(b,t);box.append(row);
  });
}
function drawGoals(d,today){
  const w=d.week,m=d.month;
  $('weekCard').classList.toggle('hidden',!w);$('monthCard').classList.toggle('hidden',!m);
  if(w){
    const same=w.key===mondayOf(new Date(today+'T00:00:00'));
    $('weekLabel').textContent=w.label+(same?'':' (PC에서 받은 지난 주 기준)');
    goalList($('weekItems'),w.items);
  }
  if(m){
    $('monthLabel').textContent=m.label;
    goalList($('monthItems'),m.items);
  }
}

let loading=false;
async function load(){
  if(loading)return;loading=true;$('refresh').disabled=true;
  try{
    const snap=await fetchSnap();
    if(!snap){$('sync').textContent='아직 PC에서 보낸 데이터가 없어요. PC 앱의 설정 → 폰 동기화 → 지금 보내기를 눌러 주세요.';}
    else{C.snap=snap;store();draw(snap,false)}
    try{await fetchMemos()}catch(e){/* 메모 실패는 화면 전체를 막지 않음 */}
    drawMemos();retryPending();
  }catch(e){
    if(C.snap)draw(C.snap,true);
    drawMemos();
    if(!C.snap)$('sync').textContent='불러오지 못했어요: '+(e&&e.message||e);
    if(/로그인|token|refresh|JWT|invalid/i.test(String(e&&e.message))){C.rt='';C.at='';store();show('setup');$('err').textContent='로그인이 만료됐어요. 다시 로그인해 주세요.'}
  }finally{loading=false;$('refresh').disabled=false}
}

/* ── 메모 (양방향) ──
   서버에서 마지막으로 본 버전(base)과 같을 때만 덮어써요. 그사이 PC에서 같은 날 메모를 고쳤다면
   두 내용을 합쳐서 둘 다 남겨요. 저장 못 한 글은 폰에 보관했다가 다시 시도해요. */
const MEMO_SEP='\n\n— 다른 기기에서 쓴 내용 —\n';
function memoMerge(a,b){a=a||'';b=b||'';if(a===b)return a;if(!a)return b;if(!b)return a;if(a.includes(b))return a;if(b.includes(a))return b;return a+MEMO_SEP+b}
const ensureC=()=>{C.memo=C.memo||{};C.pend=C.pend||{}};ensureC();   // memo: {day:{text,base}}, pend: {day:저장 못 한 글}
const timers={},saving={};
async function api(path,opt){
  const call=async tok=>fetch(base()+'/rest/v1/'+path,{...opt,headers:{apikey:C.k,Authorization:'Bearer '+tok,'Content-Type':'application/json',...(opt&&opt.headers||{})}});
  let r=await call(await access());
  if(r.status===401)r=await call(await access(true));
  return r;
}
function setStat(day,msg,err){
  const el=day===ymd(new Date())?$('memoStat'):document.querySelector('[data-stat="'+day+'"]');
  if(el){el.textContent=msg;el.classList.toggle('err',!!err)}
}
async function fetchMemos(){ensureC();
  const r=await api('memos?select=day,text,updated_at&order=day.desc&limit=30');
  if(!r.ok)throw new Error('메모 불러오기 실패 ('+r.status+')');
  for(const row of await r.json()){
    const cur=C.memo[row.day];
    if(C.pend[row.day]!==undefined)continue;          // 저장 못 한 글이 있으면 그대로 둠
    if(!cur||cur.base!==row.updated_at)C.memo[row.day]={text:row.text,base:row.updated_at};
  }
  store();
}
function memoDays(){ensureC();
  const today=ymd(new Date());
  const days=new Set(Object.keys(C.memo).filter(d=>d!==today&&(C.memo[d].text||C.pend[d])));
  return [...days].sort().reverse().slice(0,14);
}
function drawMemos(){ensureC();
  const today=ymd(new Date());
  const t=$('memoToday');
  if(t.dataset.day!==today){t.dataset.day=today;t.value='';delete t.dataset.dirty}
  if(document.activeElement!==t&&!timers[today]&&!saving[today]){
    const v=C.pend[today]!==undefined?C.pend[today]:(C.memo[today]&&C.memo[today].text)||'';
    if(t.value!==v)t.value=v;
  }
  const box=$('pastMemos'),days=memoDays();
  $('pastCard').classList.toggle('hidden',!days.length);
  // 열려 있거나 편집 중인 항목은 건드리지 않고, 없는 것만 추가·갱신
  const keep=new Set();
  days.forEach(day=>{
    keep.add(day);
    let det=box.querySelector('details[data-day="'+day+'"]');
    const text=C.pend[day]!==undefined?C.pend[day]:C.memo[day].text||'';
    if(!det){
      det=document.createElement('details');det.className='pm';det.dataset.day=day;
      const sm=document.createElement('summary');const b=document.createElement('b');const sp=document.createElement('span');sm.append(b,sp);
      const ta=document.createElement('textarea');ta.dataset.day=day;
      const st=document.createElement('div');st.className='mstat';st.dataset.stat=day;
      ta.addEventListener('input',()=>onMemoInput(day,ta));ta.addEventListener('blur',()=>flushMemo(day,ta));
      det.append(sm,ta,st);box.append(det);
    }
    const [y,mo,dd]=day.split('-');const dow='일월화수목금토'[new Date(+y,+mo-1,+dd).getDay()];
    det.querySelector('b').textContent=(+mo)+'/'+(+dd)+' '+dow;
    det.querySelector('summary span').textContent=text.split('\n')[0].slice(0,40)||'(비어 있음)';
    const ta=det.querySelector('textarea');
    if(document.activeElement!==ta&&!timers[day]&&!saving[day]&&ta.value!==text)ta.value=text;
  });
  box.querySelectorAll('details').forEach(d=>{if(!keep.has(d.dataset.day))d.remove()});
}
function onMemoInput(day,ta){ensureC();
  C.pend[day]=ta.value;store();setStat(day,'입력 중…');
  clearTimeout(timers[day]);timers[day]=setTimeout(()=>{delete timers[day];saveMemo(day,ta)},1200);
}
function flushMemo(day,ta){if(timers[day]){clearTimeout(timers[day]);delete timers[day];saveMemo(day,ta)}}
async function saveMemo(day,ta){ensureC();
  if(saving[day]){timers[day]=setTimeout(()=>{delete timers[day];saveMemo(day,ta)},600);return}
  saving[day]=true;setStat(day,'저장 중…');
  try{
    for(let tries=0;tries<4;tries++){
      const text=C.pend[day]!==undefined?C.pend[day]:ta.value;
      const cur=C.memo[day],now=new Date().toISOString();
      let r,rows;
      if(cur&&cur.base){
        r=await api('memos?day=eq.'+encodeURIComponent(day)+'&updated_at=eq.'+encodeURIComponent(cur.base),{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({text,updated_at:now})});
        if(!r.ok)throw new Error('저장 실패 ('+r.status+')');
        rows=await r.json();
      }else{
        r=await api('memos',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({day,text,updated_at:now})});
        if(r.status===409)rows=[];
        else if(!r.ok)throw new Error('저장 실패 ('+r.status+')');
        else rows=await r.json();
      }
      if(rows.length){
        C.memo[day]={text,base:rows[0].updated_at};
        if(C.pend[day]===text)delete C.pend[day];   // 저장하는 사이 더 입력했다면 보관 유지
        store();setStat(day,C.pend[day]===undefined?'저장됨 ✓':'입력 중…');return;
      }
      // 충돌: 서버의 최신 내용을 받아 합친 뒤 다시 저장
      const g=await api('memos?select=day,text,updated_at&day=eq.'+encodeURIComponent(day));
      if(!g.ok)throw new Error('저장 실패 ('+g.status+')');
      const got=await g.json(),remote=got[0];
      if(!remote){C.memo[day]={text:'',base:null};continue}
      const merged=memoMerge(text,remote.text);
      C.memo[day]={text:remote.text,base:remote.updated_at};
      C.pend[day]=merged;store();
      if(ta.value===text)ta.value=merged;             // 그사이 더 쓰지 않았을 때만 화면 갱신
      setStat(day,'PC의 내용과 합쳤어요');
    }
    throw new Error('여러 번 충돌했어요. 잠시 뒤 다시 시도해 주세요.');
  }catch(e){setStat(day,'저장 못 했어요 — 폰에 보관 중이고 다시 시도해요. ('+(e&&e.message||e)+')',true)}
  finally{saving[day]=false}
}
async function retryPending(){ensureC();
  for(const day of Object.keys(C.pend)){
    const ta=day===ymd(new Date())?$('memoToday'):document.querySelector('details[data-day="'+day+'"] textarea');
    if(ta&&!timers[day]&&!saving[day])await saveMemo(day,ta);
    else if(!ta){ // 화면에 없는 날짜의 보관 글도 올리기
      const fake={value:C.pend[day]};await saveMemo(day,fake);
    }
  }
}
$('memoToday').addEventListener('input',e=>onMemoInput(ymd(new Date()),e.target));
$('memoToday').addEventListener('blur',e=>flushMemo(ymd(new Date()),e.target));
window.addEventListener('online',()=>{if(C.rt)retryPending()});

function start(){
  const m=location.hash.match(/c=([^&]+)/);
  if(m){try{const j=JSON.parse(atob(decodeURIComponent(m[1])));if(j.u&&j.k){C.u=j.u;C.k=j.k;store()}}catch(e){}history.replaceState(null,'',location.pathname)}
  if(C.u&&C.k&&C.rt){show('main');if(C.snap)draw(C.snap,true);drawMemos();load()}
  else{show('setup');if(C.u&&C.k)$('code').value=btoa(JSON.stringify({u:C.u,k:C.k}))}
}

$('login').onclick=async()=>{
  $('err').textContent='';
  try{
    const raw=$('code').value.trim();let j;
    try{j=JSON.parse(atob(raw))}catch(e){throw new Error('연결 코드가 올바르지 않아요. PC에서 다시 복사해 주세요.')}
    if(!j.u||!j.k||!urlOk(j.u))throw new Error('연결 코드가 올바르지 않아요.');
    const email=$('email').value.trim(),pw=$('pw').value;
    if(!email||!pw)throw new Error('이메일과 비밀번호를 입력해 주세요.');
    C={u:j.u,k:j.k};
    $('login').disabled=true;
    await token('password',{email,password:pw});
    $('pw').value='';show('main');load();
  }catch(e){$('err').textContent=String(e&&e.message||e)}
  finally{$('login').disabled=false}
};
$('refresh').onclick=load;
$('logout').onclick=()=>{if(Object.keys(C.pend||{}).length&&!confirm('저장 못 한 메모가 폰에 남아 있어요. 그래도 연결을 해제할까요?'))return;if(!confirm('이 폰의 연결을 해제할까요?'))return;C={};store();show('setup');$('code').value=''};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&C.rt)load()});
setInterval(()=>{if(!document.hidden&&C.rt)load()},120000);
start();
</script>
